name: "Assemble rerun"

on:
    workflow_run:
        workflows: [ "Assemble" ]
        types: [ completed ]

permissions:
    actions: write

jobs:
    rerun:
        if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 2 }}
        runs-on: ubuntu-latest
        steps:
            -   name: Rerun failed jobs when the runner was lost
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GH_REPO: ${{ github.repository }}
                    RUN_ID: ${{ github.event.workflow_run.id }}
                run: |
                    set -uo pipefail

                    curl -sSL \
                        -H "Authorization: Bearer $GH_TOKEN" \
                        -H "Accept: application/vnd.github+json" \
                        -o run-logs.zip \
                        "https://api.github.com/repos/$GH_REPO/actions/runs/$RUN_ID/logs"

                    if ! unzip -tq run-logs.zip >/dev/null 2>&1; then
                        echo "Logs for run $RUN_ID are not available, leaving it alone."
                        exit 0
                    fi

                    markers=$(unzip -p run-logs.zip '*' 2>/dev/null \
                        | grep -cE "runner has received a shutdown signal|daemon disappeared" || true)

                    if [ "${markers:-0}" -gt 0 ]; then
                        echo "Runner was lost ($markers marker(s)), rerunning failed jobs of run $RUN_ID."
                        gh run rerun "$RUN_ID" --failed
                    else
                        echo "No runner-loss markers found, leaving run $RUN_ID as a genuine failure."
                    fi
