name: "Assemble"

on:
    pull_request:
        branches: [master, stable-*]

# Declare default permissions as read only.
permissions: read-all

concurrency:
    group: assemble-flavors-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    compile:
        runs-on: ubuntu-latest-max
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: set up JDK 21
              uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
              with:
                  distribution: "temurin"
                  java-version: 21
            - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
            - name: Cache Gradle
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                      .gradle
                  key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.run_id }}
                  restore-keys: |
                      gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-
                      gradle-${{ runner.os }}-
            - name: compile
              run: |
                  echo "org.gradle.jvmargs=-Xmx10g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g" >> gradle.properties
                  echo "org.gradle.caching=true" >> gradle.properties
                  echo "org.gradle.parallel=true" >> gradle.properties
                  echo "org.gradle.configureondemand=true" >> gradle.properties
                  ./gradlew assembleGeneric

    flavor:
        runs-on: ubuntu-latest
        needs: [compile]
        strategy:
            fail-fast: false
            matrix:
                flavor: [Generic, Gplay, Huawei]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: set up JDK 21
              uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
              with:
                  distribution: "temurin"
                  java-version: 21
            - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
            - name: Restore Gradle cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                      .gradle
                  key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.run_id }}
                  restore-keys: |
                      gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-
                      gradle-${{ runner.os }}-
            - name: Build ${{ matrix.flavor }}
              run: |
                  echo "org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g" >> gradle.properties
                  echo "org.gradle.caching=true" >> gradle.properties
                  echo "org.gradle.parallel=true" >> gradle.properties
                  echo "org.gradle.configureondemand=true" >> gradle.properties
                  ./gradlew assemble${{ matrix.flavor }}
