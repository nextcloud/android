name: "Assemble"

on:
    pull_request:
        branches: [ master, stable-* ]
    push:
        branches: [ master ]

# Declare default permissions as read only.
permissions: read-all

concurrency:
    group: assemble-flavors-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    flavor:
        name: flavor (${{ matrix.flavor }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   flavor: Generic
                        tasks: assembleGenericDebug
                    -   flavor: Gplay
                        tasks: assembleGplayDebug assembleGplayRelease
                    -   flavor: Huawei
                        tasks: assembleHuaweiDebug
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: set up JDK 21
                uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
                with:
                    distribution: "temurin"
                    java-version: 21
            -   uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
            -   name: Runner resources
                run: |
                    free -h
                    nproc
                    df -h .
            -   name: Build ${{ matrix.flavor }}
                run: |
                    {
                      echo "org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m"
                      echo "kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m"
                      echo "org.gradle.workers.max=2"
                    } >> gradle.properties
                    ./gradlew ${{ matrix.tasks }}
